# ==========================================================
# FlorestDiscordPRO - Конфигурация
# ==========================================================

discord_bot_token: "your-token-here"
# ID текстового канала, куда бот будет слать сообщения из игры
discord_channel_id: "123456789012345678"

# Настройки статуса бота (Presence)
bot_status:
  # online, idle, dnd (не беспокоить), invisible
  status_type: "online"
  # Текст активности
  activity_text: "FlorestWorld | {online} players"
  # PLAYING, WATCHING, LISTENING, STREAMING
  activity_type: "PLAYING"
  # Интервал обновления статуса в секундах
  update_interval: 60

# Форматы сообщений
# В Discord можно использовать Markdown: **жирный**, *курсив*, __подчеркнутый__
discord_message_format: "[MC] **{player}**: {message}"
minecraft_discord_format: "§9[Discord] §f{discord_name}: {discord_message}"
minecraft_discord_typing_format: "§9[Discord] §f{discord_name} печатает...."
minecraft_discord_format_with_reply: "§9[Discord] §f{discord_name}: {discord_message} §7(ответ на {author_reply})"
minecraft_discord_reaction_received: "[Discord] {discord_name} reacted with emoji {reaction} on {author}'s message: {message}"

# Сообщения при старте/выключении сервера
hello_message: "🚀 **Сервер запущен!** Всем удачной игры."
goodbye_message: "🛑 **Сервер выключен.** Игроков было: `{was_players}`"
players-format: "📊 **Online Players ({online}/{max}):**\n`{list}`"
no-players: "Nobody is online"

# Управление командами из Discord
commands:
  enabled: false
  # Нужно ли ограничивать команды только для людей с определенной ролью?
  require_role: false
  admin_role_id: "000000000000000000"

  # Сообщения об ошибках (используй {user} для упоминания через @)
  no_permission: "{user}, у тебя нет прав (роли) для управления сервером."
  command_sent: "{user}, команда отправлена в консоль!"
  command_banned: "{user}, эта команда запрещена в конфиге."

  # Список запрещенных команд для ввода из Discord
  blacklist:
    - "/stop"
    - "/op"
    - "/deop"
  plus_admin:
    - "000" # write here an ID of admins, who haven't got a permission in Discord.

# Трекер входа/выхода
join_leave:
  enabled: true
  human_joined: "📥 **{user}** зашел на сервер."
  human_quited: "📤 **{user}** покинул нас. Плаки-плаки."

# Отслеживание команд игроков (Command Tracking)
# Уведомляет админов в Discord, когда кто-то пишет команды в игре
command_tracking:
  enabled: false
  format: "⚠️ `{user}` использовал команду: `{command}`"
  # Какие команды мониторить ('all' - все)
  whitelist:
    - "all"
  # Что НЕ логировать (если whitelist: all)
  blacklist:
    - "/login"
    - "/reg"
    - "/msg"
    - "/w"

# Фильтрация сообщений
restrictions:
  # Если сообщение в Minecraft начинается с этого символа, оно не летит в Discord
  prefix_ignore_mc: "#"
  # Если сообщение в Discord начинается с этого символа, оно не летит в игру
  prefix_ignore_discord: "!"

# Достижения (Advancements)
advancements:
  enabled: true
  format: "🏆 **{user}** получил достижение: **[{advancement}]**"

# Мониторинг производительности (TPS)
tps_tracking:
  enabled: true
  min_tps: 15.0
  message: "🚨 **Внимание!** На сервере упал TPS: `{tps}`"

support_luckperms_prefix: true
enable_webhook: false # для того, чтобы отсылать сообщения игроков от их имени через вебхук
webhook_url: "URL of webhook in the channel."
tps_message: "TPS: {tps}.\nRAM usage: {ram_usage}/{ram_maximum}"
player_message: "Now "

2fa_message: "Hey, {username}! You have got request to enter your account.\nIP: {ip}\n\nCode: {code}\nIf it wasn't you, ignore this message."
2fa_message_enter: "Hey, {username}! Enter your code from Discord to enter this session."
2fa_disabled: "2fa was disabled."
2fa_connected: "On this DS account {player} made his/her Minecraft 2FA. If it wasn't you, ignore."
2fa_connected_minecraft: "2FA successfully installed! Please check what you have access to your Discord account which you entered in the command. If you don't have any access to this DS account, REVOKE THE 2FA RIGHT NOW with command /2fa disable."
2fa_not_passed: "Bro! Pass the 2FA for this action. Command: /2fa code <CODE FROM DISCORD>"
2fa_inactive: "2FA is not activated."
2fa_passed: "2FA is already verified."
2fa_verified: "You successfully entered your account!"
2fa_failed: "You failed 2FA. If you lost access to your Discord account, write to the Server Administration."